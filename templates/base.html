<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; }
        nav {
            background: #1a1a1a;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
        }
        nav .logo { font-size: 22px; font-weight: 700; color: #00d4aa; }
        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 24px;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover { color: #00d4aa; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-green { background: #00d4aa; color: #000; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; font-size: 13px; padding: 6px 14px; }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            margin-top: 6px;
        }
        label { font-size: 14px; color: #aaa; }
        .form-group { margin-bottom: 18px; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">⚡ FitLog</span>
        <div>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/strength">Log Strength</a>
            <a href="/cardio">Log Cardio</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

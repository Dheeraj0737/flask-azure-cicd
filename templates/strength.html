{% extends 'base.html' %}
{% block content %}
<h2 style="margin-bottom: 24px;">Log Strength Session 💪</h2>
<div class="card" style="max-width: 560px;">
    <form method="POST">
        <div class="form-group">
            <label>Exercise</label>
            <input type="text" name="exercise" placeholder="e.g. Bench Press" required>
        </div>
        <div class="form-group">
            <label>Sets</label>
            <input type="number" name="sets" placeholder="e.g. 4" required>
        </div>
        <div class="form-group">
            <label>Reps</label>
            <input type="number" name="reps" placeholder="e.g. 8" required>
        </div>
        <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" step="0.5" name="weight" placeholder="e.g. 80" required>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3" placeholder="How did it feel?"></textarea>
        </div>
        <button type="submit" class="btn btn-green">Save Session</button>
    </form>
</div>
{% endblock %}

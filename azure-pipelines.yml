trigger:
  - main

variables:
  acrLoginServer: 'fitlogregistry.azurecr.io'
  imageName: 'fitlog-app'
  vmIP: '4.255.215.220'
  vmUser: 'fitlogadmin'

stages:
  - stage: Build
    displayName: 'Build and Push to ACR'
    jobs:
      - job: BuildPush
        pool:
           name: Default
        steps:
          - task: Docker@2
            displayName: 'Build and push image'
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: Dockerfile
              containerRegistry: 'ACRServiceConnection'
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure VM'
    dependsOn: Build
    jobs:
      - job: Deploy
        pool:
           name: Default
        steps:
          - task: SSH@0
            displayName: 'Deploy container on VM'
            inputs:
              sshEndpoint: 'VMServiceConnection'
              runOptions: 'inline'
              inline: |
                docker login $(acrLoginServer) -u $(acrUser) -p $(acrPassword)
                docker pull $(acrLoginServer)/$(imageName):latest
                docker stop fitlog-app || true
                docker rm fitlog-app || true
                docker run -d --name fitlog-app -p 5000:5000 $(acrLoginServer)/$(imageName):latest
